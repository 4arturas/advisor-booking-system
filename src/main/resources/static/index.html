<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advisor Booking System</title>
    <link href="https://unpkg.com/antd@6.4.4/dist/antd.css" rel="stylesheet">
    <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
    <script src="https://unpkg.com/dayjs@1.11.13/dayjs.min.js"></script>
    <script src="https://unpkg.com/dayjs@1.11.13/plugin/advancedFormat.js"></script>

    <script type="module">
        import React from "https://esm.sh/react@19?dev";
        import { createRoot } from "https://esm.sh/react-dom@19/client?dev";
        import { Button, Tabs, Typography, Card, Space, Select, Table, Spin, Alert, Form, Input, DatePicker, Row, Col, Modal } from "https://esm.sh/antd@6.4.4?dev&bundle";

        globalThis.React = React;
        globalThis.ReactDOM = { createRoot };
        globalThis.antd = { Button, Tabs, Typography, Card, Space, Select, Table, Spin, Alert, Form, Input, DatePicker, Row, Col, Modal };
    </script>

    <style>
        body { margin: 0; padding: 0; background: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #root { min-height: 100vh; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;
    const { Select, Table, Spin, Alert, Row, Col, Card, DatePicker, Button, Form, Input, Modal } = antd;

    dayjs.extend(dayjs_plugin_advancedFormat);

    const formatTime = (isoStr) => dayjs(isoStr).format("HH:mm");
    const formatDate = (isoStr) => dayjs(isoStr).format("ddd, MMM D");

    function BookingApp() {
        const [advisors, setAdvisors] = useState([]);
        const [loadingAdvisors, setLoadingAdvisors] = useState(true);
        const [selectedAdvisor, setSelectedAdvisor] = useState(null);
        const [selectedDate, setSelectedDate] = useState(null);
        const [slots, setSlots] = useState([]);
        const [loadingSlots, setLoadingSlots] = useState(false);
        const [error, setError] = useState(null);
        const [form] = Form.useForm();
        const [modalVisible, setModalVisible] = useState(false);
        const [selectedSlot, setSelectedSlot] = useState(null);
        const [bookingLoading, setBookingLoading] = useState(false);
        const [bookingResult, setBookingResult] = useState(null);

        useEffect(() => {
            fetch("/api/advisors")
                .then(res => res.json())
                .then(data => setAdvisors(data.advisors || []))
                .catch(() => setAdvisors([]))
                .finally(() => setLoadingAdvisors(false));
        }, []);

        const fetchAvailability = () => {
            if (!selectedAdvisor || !selectedDate) return;
            setLoadingSlots(true);
            setError(null);
            const dateStr = selectedDate.format("YYYY-MM-DD");
            fetch(`/api/availability?advisorId=${selectedAdvisor}&date=${dateStr}`)
                .then(res => res.json())
                .then(data => setSlots(data.availableSlots || []))
                .catch(() => { setError("Failed to fetch availability"); setSlots([]); })
                .finally(() => setLoadingSlots(false));
        };

        useEffect(() => {
            fetchAvailability();
        }, [selectedAdvisor, selectedDate]);

        const openBookingModal = (slot) => {
            setSelectedSlot(slot);
            setBookingResult(null);
            form.resetFields();
            setModalVisible(true);
        };

        const handleBooking = async (values) => {
            setBookingLoading(true);
            setBookingResult(null);
            try {
                const res = await fetch("/api/bookings", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        advisorId: selectedAdvisor,
                        customerName: values.customerName,
                        customerEmail: values.customerEmail,
                        slotId: selectedSlot.slotId
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    const startTime = data.slotStartTime || data.startTime;
                    setBookingResult({ type: "success", text: `Booking confirmed for ${formatDate(startTime)} at ${formatTime(startTime)}.` });
                    setSlots((prev) => prev.map((s) => s.slotId === selectedSlot.slotId ? { ...s, isBooked: true } : s));
                    setTimeout(() => {
                        setModalVisible(false);
                        setBookingResult(null);
                    }, 2000);
                } else {
                    setBookingResult({ type: "error", text: data.error || data.message || "Booking failed" });
                }
            } catch (err) {
                setBookingResult({ type: "error", text: "Network error. Please try again." });
            } finally {
                setBookingLoading(false);
            }
        };

        const advisorName = selectedAdvisor
            ? (advisors.find(a => a.id === selectedAdvisor)?.name || `Advisor #${selectedAdvisor}`)
            : "";

        const columns = [
            { title: "Start Time", key: "startTime", render: (_, r) => formatTime(r.startTime) },
            { title: "End Time", key: "endTime", render: (_, r) => formatTime(r.endTime) },
            { title: "Duration", key: "duration", render: () => "1 hour" },
            { title: "Status", key: "status", render: (_, r) => r.isBooked ? "Booked" : "Available" },
            {
                title: "", key: "action", width: 100,
                render: (_, record) => (
                    <Button type="primary" size="small" disabled={record.isBooked} onClick={() => openBookingModal(record)}>
                        Book
                    </Button>
                )
            }
        ];

        return (
            <div>
                <Row gutter={[24, 24]}>
                    <Col xs={24} lg={10}>
                        <Card size="small" title="Select Advisor & Date">
                            <div style={{ marginBottom: 16 }}>
                                <div style={{ marginBottom: 8, fontWeight: 500 }}>Advisor</div>
                                <Select
                                    placeholder={loadingAdvisors ? "Loading..." : "Select advisor"}
                                    style={{ width: "100%" }}
                                    size="large"
                                    onChange={setSelectedAdvisor}
                                    loading={loadingAdvisors}
                                    disabled={loadingAdvisors}
                                    options={advisors.map(a => ({ value: a.id, label: a.name }))}
                                />
                            </div>
                            <div>
                                <div style={{ marginBottom: 8, fontWeight: 500 }}>Date</div>
                                <DatePicker
                                    style={{ width: "100%" }}
                                    size="large"
                                    onChange={setSelectedDate}
                                    format="YYYY-MM-DD"
                                />
                            </div>
                        </Card>
                    </Col>

                    <Col xs={24} lg={14}>
                        <Card size="small" title="Available Time Slots">
                            {error && <Alert message={error} type="error" showIcon style={{ marginBottom: 16 }} />}
                            {!selectedAdvisor || !selectedDate ? (
                                <div style={{ textAlign: "center", padding: "40px 0", color: "#999" }}>
                                    Please select an advisor and date to view available slots
                                </div>
                            ) : loadingSlots ? (
                                <div style={{ textAlign: "center", padding: "40px 0" }}>
                                    <Spin tip="Loading slots..." />
                                </div>
                            ) : (
                                <Table
                                    dataSource={slots}
                                    columns={columns}
                                    rowKey="slotId"
                                    pagination={false}
                                    size="middle"
                                    locale={{ emptyText: "No available slots for this date" }}
                                />
                            )}
                        </Card>
                    </Col>
                </Row>

                <Modal
                    title="Book Appointment"
                    open={modalVisible}
                    onCancel={() => { setModalVisible(false); setBookingResult(null); }}
                    footer={null}
                    width={480}
                >
                    {selectedSlot && (
                        <div style={{ marginBottom: 20, padding: "12px 16px", background: "#f6f8fa", borderRadius: 8, border: "1px solid #e8e8e8" }}>
                            <div style={{ marginBottom: 4 }}><strong>Advisor:</strong> {advisorName}</div>
                            <div style={{ marginBottom: 4 }}><strong>Date:</strong> {selectedDate?.format("YYYY-MM-DD")}</div>
                            <div><strong>Time:</strong> {formatTime(selectedSlot.startTime)} — {formatTime(selectedSlot.endTime)}</div>
                        </div>
                    )}

                    {bookingResult && (
                        <Alert message={bookingResult.text} type={bookingResult.type} showIcon style={{ marginBottom: 16 }} />
                    )}

                    <Form form={form} layout="vertical" onFinish={handleBooking}>
                        <Form.Item name="customerName" label="Your Name" rules={[{ required: true, message: "Please enter your name" }]}>
                            <Input placeholder="John Doe" size="large" />
                        </Form.Item>
                        <Form.Item name="customerEmail" label="Your Email" rules={[
                            { required: true, message: "Please enter your email" },
                            { type: "email", message: "Please enter a valid email" }
                        ]}>
                            <Input placeholder="john@example.com" size="large" />
                        </Form.Item>
                        <Form.Item style={{ marginBottom: 0 }}>
                            <Button type="primary" htmlType="submit" loading={bookingLoading} size="large" block>
                                Confirm Booking
                            </Button>
                        </Form.Item>
                    </Form>
                </Modal>
            </div>
        );
    }
</script>

<script type="text/babel">
    const { useState, useEffect } = React;
    const { Typography } = antd;
    const { Title } = Typography;

    function App() {
        const [server, setServer] = useState(null);

        useEffect(() => {
            fetch("/api/advisors")
                .then(res => res.json())
                .then(() => setServer(window.location.port === "8080" ? "Spring Boot" : "Node-RED"))
                .catch(() => setServer("unknown"));
        }, []);

        return (
            <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
                <div style={{ background: "#001529", padding: "16px 40px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <Title level={3} style={{ margin: 0, color: "#fff" }}>Advisor Booking System</Title>
                    {server && <span style={{ color: "#aaa", fontSize: 13 }}>{server} :{window.location.port}</span>}
                </div>
                <div style={{ flex: 1, padding: "24px 40px" }}>
                    <Card style={{ height: "100%" }}>
                        <BookingApp />
                    </Card>
                </div>
            </div>
        );
    }

    const { createRoot } = ReactDOM;
    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
</script>
</body>
</html>
